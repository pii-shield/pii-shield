---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: piipolicies.core.pii-shield.io
spec:
  group: core.pii-shield.io
  names:
    kind: PiiPolicy
    listKind: PiiPolicyList
    plural: piipolicies
    singular: piipolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PiiPolicy is the Schema for the piipolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PiiPolicy
            properties:
              auditMode:
                description: |-
                  AuditMode is the dry run: the sidecar scans every line as usual but
                  writes it out unchanged, byte for byte, and only counts what it would
                  have redacted (PII_MODE=audit; the counters are
                  piishield_audit_lines_total and piishield_audit_findings_total, so the
                  webhook also turns the sidecar's metrics on, on port 9090, and an
                  hourly summary in its log). Run a policy in audit mode on real traffic
                  first, look at the numbers, then set it to false; the change needs a
                  pod restart. Works with injectionMode file and pipe (in pipe mode the
                  sidecar still sits in the stream's path), and is required with ebpf,
                  whose agent only observes (#96).
                type: boolean
              confidenceThreshold:
                description: |-
                  ConfidenceThreshold is the threshold for the PII scanner.
                  Exported to the sidecar as PII_CONFIDENCE_THRESHOLD.
                type: number
              customRegexList:
                description: |-
                  CustomRegexList adds redaction rules on top of the built-in detectors.
                  Exported to the sidecar as JSON in PII_CUSTOM_REGEX_LIST.
                items:
                  description: RegexRule is a named regular expression passed to the
                    scanner.
                  properties:
                    name:
                      description: Name identifies the rule in redaction output and
                        metrics
                      type: string
                    pattern:
                      description: Pattern is an RE2 regular expression
                      minLength: 1
                      type: string
                  required:
                  - pattern
                  type: object
                type: array
              entropyThreshold:
                description: |-
                  EntropyThreshold overrides the scanner entropy threshold.
                  Exported to the sidecar as PII_ENTROPY_THRESHOLD.
                type: number
              failPolicy:
                description: |-
                  FailPolicy determines the sidecar behavior when sanitization fails:
                  "open" passes the raw line through (default), "closed" drops it.
                  Exported to the sidecar as PII_FAIL_POLICY.
                enum:
                - open
                - closed
                type: string
              injectionMode:
                description: |-
                  InjectionMode defines the mode: "file", "pipe", or "ebpf".
                  "pipe" mode is EXPERIMENTAL: it rewrites the target container command
                  through "/bin/sh -c", which can break distroless images (no shell),
                  argument quoting, signal handling, and the app lifecycle. Not
                  recommended for production; see KNOWN_LIMITATIONS.md.
                  "ebpf" is EXPERIMENTAL and observation only: the eBPF audit agent
                  shares the pod's pid namespace and counts what it would have redacted
                  in the pod's stdout and stderr, so it requires auditMode: true. It
                  needs a kernel of 5.8 or newer with BTF and the BPF and PERFMON
                  capabilities; there is no eBPF redaction.
                enum:
                - file
                - pipe
                - ebpf
                type: string
              logPath:
                description: LogPath is the path where the application writes logs
                  (for "file" mode)
                type: string
              minSecretLength:
                description: |-
                  MinSecretLength is the minimum token length considered a secret.
                  Exported to the sidecar as PII_MIN_SECRET_LENGTH.
                minimum: 1
                type: integer
              originalCommand:
                description: |-
                  OriginalCommand is the original app command (for the experimental
                  "pipe" mode); it is executed through "/bin/sh -c"
                type: string
              remoteConfig:
                description: |-
                  RemoteConfig pulls the rules from a central rule repository and lays
                  the rule fields set in this policy over them. See RemoteConfig.
                properties:
                  allowInsecure:
                    description: |-
                      AllowInsecure permits an http:// URL and skips certificate
                      verification for https://. For tests and air-gapped lab clusters only;
                      the RemoteSynced condition carries a warning while it is set.
                    type: boolean
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef names a key in a Secret in the policy's namespace
                      that holds a PEM bundle used to verify the server certificate instead
                      of the system roots.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  headerSecretRef:
                    description: |-
                      HeaderSecretRef names a key in a Secret in the policy's namespace whose
                      value is sent as the whole Authorization header, for example
                      "Bearer <token>". The value never appears in the policy or its status.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is how often the file is pulled. Default 300,
                      minimum 30. A failed pull is retried after at most 60 seconds.
                    format: int32
                    minimum: 30
                    type: integer
                  signature:
                    description: |-
                      Signature, when set, makes the controller accept only a file signed
                      with one of PublicKeys. A file without a valid signature, signed by
                      another key, for another set, or older than the last one accepted is
                      refused and the last good copy stays in use.
                    properties:
                      publicKeys:
                        description: |-
                          PublicKeys are the trusted Ed25519 public keys, each
                          "ed25519:<base64 of the 32-byte key>" as the rule server's Signing
                          keys page shows them.
                        items:
                          type: string
                        minItems: 1
                        type: array
                      set:
                        description: |-
                          Set is the "<org>/<set>" name the signed statement must carry.
                          Default: taken from a policy URL ending in /v1/<org>/<set>/policy.json.
                        type: string
                      url:
                        description: |-
                          URL of the signature file. Default: the policy URL with ".sig"
                          appended to its path.
                        type: string
                    required:
                    - publicKeys
                    type: object
                  url:
                    description: URL of the policy file. Must be https:// unless AllowInsecure
                      is set.
                    minLength: 8
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
              resources:
                description: Resources allows configuration of compute resources for
                  the injected sidecar
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              safeRegexList:
                description: |-
                  SafeRegexList whitelists matches that must never be redacted.
                  Exported to the sidecar as JSON in PII_SAFE_REGEX_LIST.
                items:
                  description: RegexRule is a named regular expression passed to the
                    scanner.
                  properties:
                    name:
                      description: Name identifies the rule in redaction output and
                        metrics
                      type: string
                    pattern:
                      description: Pattern is an RE2 regular expression
                      minLength: 1
                      type: string
                  required:
                  - pattern
                  type: object
                type: array
              salt:
                description: |-
                  Salt is the deterministic hashing salt, exported to the sidecar as
                  PII_SALT. Use at least 16 characters. The value is stored in plain
                  text in the policy object — prefer SaltSecretKeyRef in production.
                type: string
              saltSecretKeyRef:
                description: |-
                  SaltSecretKeyRef references a key in a Secret that holds the
                  deterministic hashing salt. Takes precedence over Salt. The Secret is
                  resolved in the namespace of each injected pod, and the sidecar
                  receives it as PII_SALT via a secretKeyRef, so the value never appears
                  in the PiiPolicy object or the mutated pod spec.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              sensitiveKeyPatterns:
                description: |-
                  SensitiveKeyPatterns are case-insensitive regexes matched against keys.
                  Exported to the sidecar as comma-separated PII_SENSITIVE_KEY_PATTERNS.
                items:
                  type: string
                type: array
              sensitiveKeys:
                description: |-
                  SensitiveKeys replaces the scanner's default sensitive key list.
                  Exported to the sidecar as comma-separated PII_SENSITIVE_KEYS.
                items:
                  type: string
                type: array
              stats:
                description: |-
                  Stats, when set, turns on the stats channel: the sidecars of this
                  policy expose their counters inside the cluster, the operator reads
                  them, and every IntervalSeconds sends one summary of counters to URL.
                  Off by default. See StatsConfig.
                properties:
                  allowInsecure:
                    description: |-
                      AllowInsecure permits an http:// URL and skips certificate
                      verification. For tests and lab clusters only.
                    type: boolean
                  caBundleSecretRef:
                    description: |-
                      CABundleSecretRef names a key in a Secret in the policy's namespace
                      that holds a PEM bundle used to verify the receiver's certificate.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  clusterName:
                    description: |-
                      ClusterName names this cluster in the reports, so a receiver can tell
                      clusters that share a token apart. Default: empty.
                    maxLength: 128
                    type: string
                  headerSecretRef:
                    description: |-
                      HeaderSecretRef names a key in a Secret in the policy's namespace whose
                      value is sent as the whole Authorization header, for example
                      "Bearer pss_…", a rule server's report token. Use a token that can
                      only send reports, never the one that pulls rules.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is how often a report is sent. Default 300, minimum 60.
                      The counters are read every 30 seconds in between.
                    format: int32
                    minimum: 60
                    type: integer
                  url:
                    description: |-
                      URL the report is POSTed to. Must be https:// unless AllowInsecure is
                      set. For a rule server: https://<server>/v1/<org>/<set>/report.
                    minLength: 8
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
            required:
            - injectionMode
            type: object
            x-kubernetes-validations:
            - message: 'injectionMode ebpf is the eBPF audit agent, which only observes;
                set auditMode: true (there is no eBPF redaction, see #96)'
              rule: self.injectionMode != 'ebpf' || (has(self.auditMode) && self.auditMode)
          status:
            description: status defines the observed state of PiiPolicy
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the PiiPolicy resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              remote:
                description: |-
                  Remote describes the last good pull from spec.remoteConfig; unset when
                  the policy has no remote source or no pull has succeeded yet. The
                  RemoteSynced condition carries the outcome of the latest pull.
                properties:
                  etag:
                    description: |-
                      ETag is the entity tag of the last good file, sent back as
                      If-None-Match on the next pull.
                    type: string
                  hash:
                    description: Hash is a content hash of the last good file.
                    type: string
                  lastSyncTime:
                    description: |-
                      LastSyncTime is when the source last answered with a valid file or a
                      304 Not Modified.
                    format: date-time
                    type: string
                  publication:
                    description: |-
                      Publication is the publication number of the last good file when
                      signatures are required; a lower one is refused as a replay.
                    format: int64
                    type: integer
                  revision:
                    description: Revision is the revision field of the last good file,
                      if it has one.
                    type: string
                  signedBy:
                    description: SignedBy is the id of the key that signed the last
                      good file.
                    type: string
                type: object
              renderedPolicyConfigMap:
                description: |-
                  RenderedPolicyConfigMap is the name of the ConfigMap in this namespace
                  that holds the rendered rules file (policy.json) mounted into every
                  sidecar injected for this policy. The sidecar reloads the file when it
                  changes, so a spec edit reaches running pods without a restart.
                type: string
              renderedPolicyHash:
                description: |-
                  RenderedPolicyHash is a content hash of the rendered rules file; it
                  changes only when the rules do.
                type: string
              stats:
                description: Stats describes the stats channel; unset when spec.stats
                  is unset.
                properties:
                  lastError:
                    description: |-
                      LastError is why the latest report or read failed; empty after a
                      success.
                    type: string
                  lastReportTime:
                    description: LastReportTime is when the receiver last accepted
                      a report.
                    format: date-time
                    type: string
                  podsReporting:
                    description: |-
                      PodsReporting and PodsTotal count the policy's pods whose counters
                      were read at the latest pass, and all of its injected pods.
                    format: int32
                    type: integer
                  podsTotal:
                    format: int32
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
