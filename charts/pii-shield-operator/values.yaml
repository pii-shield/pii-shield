# Default values for pii-shield-operator.

replicaCount: 1

image:
  repository: ghcr.io/pii-shield/pii-shield-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "operator-controller-manager"

podAnnotations: {}

# Hardened pod-level defaults, matching the "restricted" Pod Security
# Standard. The operator image is a distroless static binary that already
# runs as UID 65532, so these only state what the image does anyway.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Install CRDs
installCRDs: true

# Webhook Certificate Configuration
webhook:
  # If true, uses cert-manager to generate and manage certificates.
  # If false, Helm will generate self-signed certificates during installation.
  useCertManager: true
  # Admission failure behavior. Use Ignore for availability-first rollout, Fail for compliance-sensitive enforcement.
  failurePolicy: Ignore
  # Strict mode: deny pods that request injection (pii-shield.io/inject: "true")
  # but have no resolvable PiiPolicy, instead of letting them start unprotected.
  # For real enforcement, pair strictMode: true with failurePolicy: Fail so the
  # denial cannot be bypassed when the webhook is unavailable.
  strictMode: false

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Advanced Configuration for the PII-Shield Agent injected into Pods
sidecar:
  image:
    repository: ghcr.io/pii-shield/pii-shield-agent
    tag: ""
  # fsGroup to inject into the mutated pod if none is specified
  fsGroup: 65532
  # If true, injects the sidecar into 'containers' instead of 'initContainers'
  legacySidecarMode: false
  # Cluster-wide default salt for deterministic hashing, referenced from an
  # existing Secret. Used when a PiiPolicy sets neither salt nor
  # saltSecretKeyRef. The Secret is resolved in each injected pod's
  # namespace, so it must exist in every namespace where injection happens.
  saltSecret:
    name: ""
    key: "salt"

# Observability Configuration
metrics:
  prometheusRule:
    enabled: false
    # namespace: monitoring
    labels: {}
    alertLabels: {}
    operatorDownFor: 5m
    webhookEndpointFor: 5m
    certExpiresSoonSeconds: 604800
    certExpiresSoonFor: 30m
    injectionEventFor: 5m
    # spec.remoteConfig: the last successful pull is older than three intervals
    remoteRulesStaleFor: 5m
    # spec.remoteConfig: any failed pull in the last 15 minutes
    remoteRulesErrorsFor: 15m
