replicaCount: 1

image:
  repository: thelisdeep/pii-shield
  pullPolicy: IfNotPresent
  # 2.1.0+ ships the scratch-based binary driven via `--watch-file` (see the
  # deployment template). Older tags (e.g. v1.2.3) predate that flag and won't
  # work with this chart.
  tag: "2.2.3"

watchFile: /var/log/app/output.log

demo:
  enabled: false
  generatorImage:
    repository: alpine
    pullPolicy: IfNotPresent
    # Pinned tag so demo installs are reproducible and never pull a floating
    # `latest`. Demo is disabled by default; this only affects `demo.enabled`.
    tag: "3.20"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "9090"

podLabels: {}

# Hardened pod-level defaults. fsGroup makes the shared emptyDir readable by the
# non-root sidecar regardless of which UID the application container writes as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Hardened container-level defaults. The PII-Shield image is a scratch static
# binary that only reads the watched file and writes sanitized output to stdout,
# so it runs comfortably as non-root with a read-only root filesystem.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 50m
    memory: 30Mi
  requests:
    cpu: 50m
    memory: 30Mi

# PII-Shield Configuration
piiConfig:
  # PII_SALT: Random byte string used for HMAC hashing. Recommended to set for persistent hashes.
  # Prefer saltSecret below over this plaintext value for production installs.
  salt: ""

  # Source PII_SALT from an existing Secret instead of a plaintext value. When
  # saltSecret.name is set it takes precedence over the plaintext `salt` above,
  # so the salt is never rendered into the Deployment manifest.
  saltSecret:
    name: ""
    key: "salt"

  # PII_REQUIRE_STRONG_SALT: Reject explicitly configured salts shorter than 16 bytes
  requireStrongSalt: "false"
  
  # Configuration tuning
  # PII_ENTROPY_THRESHOLD: Shannon entropy threshold (3.0 - 8.0)
  entropyThreshold: "3.6"
  
  # PII_MIN_SECRET_LENGTH: Minimum length of a string to be considered a candidate token
  minSecretLength: "6"
  
  # PII_SENSITIVE_KEYS: Comma-separated list of keys whose values are always
  # redacted. Leave empty to keep the scanner's built-in 18-key default
  # (password, secret, token, key, cvv, cvc, auth, sign, api_key, apikey,
  # access_token, client_secret, aws_access_key_id, aws_secret_access_key,
  # gcp_credentials, slack_token, ...). Setting this REPLACES that default list
  # rather than extending it, so include every key you want redacted.
  sensitiveKeys: ""
  
  # PII_ADAPTIVE_THRESHOLD: Enable statistical learning
  adaptiveThreshold: "false"

  # PII_FAIL_POLICY: open keeps log flow alive on processing failure; closed emits drop markers
  failPolicy: "open"

  # PII_CUSTOM_REGEX_LIST: JSON array of regex objects to enforce redaction
  # Example: '[{"pattern": "^TX-\\d{5}$", "name": "TX"}]'
  customRegexList: ""

  # PII_SAFE_REGEX_LIST: JSON array of regex objects to ignore
  safeRegexList: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Optional NetworkPolicy restricting ingress to the metrics port only. Egress is
# left unrestricted so log shipping and DNS keep working. Off by default so it
# never breaks clusters without a NetworkPolicy-capable CNI.
networkPolicy:
  enabled: false
  # Optional list of NetworkPolicy "from" peers allowed to reach the metrics
  # port. Empty allows any source (still limited to the metrics port).
  metricsFrom: []

# Observability Configuration
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    # namespace: monitoring
    # labels:
    #   release: prometheus
  prometheusRule:
    enabled: false
    # namespace: monitoring
    labels: {}
    alertLabels: {}
    targetDownFor: 5m
    restartThreshold: 0
    restartFor: 5m
    errorRateThreshold: 0
    errorRateFor: 10m
    p95LatencySeconds: 0.05
    latencyFor: 10m
    noThroughputFor: 30m

# Operator configuration
legacySidecarMode: false
