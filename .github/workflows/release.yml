name: Release PII-Shield

# One workflow per tag, in order: tests, full lint, SDK and chart checks,
# image smoke tests, then GoReleaser, and only after it succeeded the Docker
# images and the SDK packages. The publishes used to be two workflows of
# their own on the same tag: when v2.3.0's lint gate failed and GoReleaser
# was skipped, PyPI, npm and Docker Hub had already shipped 2.3.0, and a
# version cannot be published there twice.
on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    name: Test (Root, Operator & Rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Run Root Module Tests (Race)
        run: go test -race ./...

      - name: Run Operator Module Tests (Race)
        working-directory: operator
        run: go test -race ./...

      - name: Run eBPF Agent Module Tests (Race)
        working-directory: ebpf
        run: go test -race ./...

      - name: Run Rule Server Module Tests (Race)
        working-directory: rules
        run: go test -race ./...

      - name: Compile WASM FFI
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o pii-shield-wasi.wasm cmd/wasm-ffi/main.go

      - name: Upload WASM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiled-wasm
          path: pii-shield-wasi.wasm

  sdk-node:
    name: Node SDK Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.x'

      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-wasm
          path: .

      - name: Test Node SDK
        working-directory: sdks/node
        run: node test.js

  sdk-python:
    name: Python SDK Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-wasm
          path: .

      - name: Install dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install wasmtime

      - name: Test Python SDK
        working-directory: sdks/python
        run: python test.py

  helm-lint:
    name: Lint & Verify Helm Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Lint Helm Charts
        run: |
          helm lint charts/pii-shield
          helm lint charts/pii-shield-operator
          helm template charts/pii-shield >/dev/null
          helm template charts/pii-shield-operator >/dev/null
          helm template charts/pii-shield-operator \
            --set webhook.failurePolicy=Fail --set webhook.strictMode=true \
            | grep -q 'failurePolicy: Fail'
          helm template charts/pii-shield-operator \
            --set webhook.strictMode=true \
            | grep -q 'STRICT_MODE'

      - name: Verify Helm Runtime
        run: scripts/verify-helm-runtime.sh

  lint:
    name: Full Lint (Root Module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint (full, not only-new-issues)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          # v2.14.0 is the first release whose x/tools can read Go 1.27 export data.
          # Released binaries are built with Go 1.26 and refuse a go.mod targeting
          # 1.27.3, so build the linter with the repo's own toolchain.
          install-mode: goinstall

  dependency-verification:
    name: Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Verify Root Module Dependencies
        run: go mod verify

      - name: Verify Operator Module Dependencies
        working-directory: operator
        run: go mod verify

      - name: Verify eBPF Agent Module Dependencies
        working-directory: ebpf
        run: go mod verify

      - name: Verify Rule Server Module Dependencies
        working-directory: rules
        run: go mod verify

  image-smoke-test:
    name: Image Smoke Tests (CLI, Agent, Operator, eBPF, Rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build CLI image
        run: docker build -t pii-shield-cli:smoke -f Dockerfile .

      - name: Smoke test CLI image
        run: |
          echo 'user password=hunter2 token=abcDEF123456' | docker run -i --rm pii-shield-cli:smoke | grep -q '\[HIDDEN:'

      - name: Build agent image
        run: docker build -t pii-shield-agent:smoke -f Dockerfile.agent .

      - name: Smoke test agent image
        run: |
          echo 'user password=hunter2 token=abcDEF123456' | docker run -i --rm pii-shield-agent:smoke | grep -q '\[HIDDEN:'

      - name: Build operator image
        run: docker build -t pii-shield-operator:smoke -f operator/Dockerfile operator

      - name: Smoke test operator image
        run: docker run --rm pii-shield-operator:smoke --help 2>&1 | grep -q 'metrics-bind-address'

      - name: Build eBPF agent image
        run: docker build -t pii-shield-ebpf:smoke -f ebpf/Dockerfile .

      - name: Smoke test eBPF agent image (loads the program into the runner's kernel)
        run: scripts/smoke-ebpf-image.sh pii-shield-ebpf:smoke

      - name: Build rule server image
        run: docker build -t pii-shield-rules:smoke -f rules/Dockerfile .

      - name: Smoke test rule server image
        run: scripts/smoke-rules-server.sh pii-shield-rules:smoke

  goreleaser:
    needs: [test, sdk-node, sdk-python, helm-lint, lint, dependency-verification, image-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: v2.12.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

  docker-publish:
    name: Build & push Docker images
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        component: 
          - name: pii-shield
            dockerfile: Dockerfile
            context: .
          - name: pii-shield-operator
            dockerfile: operator/Dockerfile
            context: operator
          - name: pii-shield-agent
            dockerfile: Dockerfile.agent
            context: .
          - name: pii-shield-ebpf
            dockerfile: ebpf/Dockerfile
            context: .
          - name: pii-shield-rules
            dockerfile: rules/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component.name }}
            thelisdeep/${{ matrix.component.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  build-wasm:
    name: Compile WASM kernel for the SDKs
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      # We need Go 1.26 or 1.24+ to use //go:wasmexport and wasip1 OS
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'

      - name: Compile WASM Kernel (FFI Layer)
        run: |
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o pii-shield-wasi.wasm cmd/wasm-ffi/main.go
          
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-binary
          path: pii-shield-wasi.wasm

  publish-npm:
    name: Publish Node SDK to npm
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Download WASM Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasm-binary
          path: sdks/node/
          
      - name: Publish NPM package
        working-directory: sdks/node
        run: |
          npm install
          npm publish --access public
          
  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          
      - name: Download WASM Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasm-binary
          path: sdks/python/pii_shield/
          
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine
          
      - name: Build python wheel and sdist
        working-directory: sdks/python
        run: python -m build
        
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: sdks/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
