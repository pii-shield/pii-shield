name: Deployment Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Deployment group: local, published, cluster, cluster-published, all"
        required: false
        default: "all"

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54

jobs:
  deployment-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5
        with:
          node-version: "22"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4

      - name: Install kind
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install kind /usr/local/bin/kind

      # No PII_SHIELD_ACCESS_LOG is set, so the runner generates a synthetic
      # fixture (scripts/generate-access-log-fixture.sh). Real log fixtures
      # must never be uploaded to CI.
      - name: Run deployment matrix
        run: scripts/test-deployments.sh "${{ github.event.inputs.group || 'all' }}"
