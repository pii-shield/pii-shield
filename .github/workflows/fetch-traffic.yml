name: Fetch GitHub Traffic Stats

on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC = 07:30 GMT+3
  workflow_dispatch: {}

jobs:
  fetch-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private stats repo
        uses: actions/checkout@v7.0.1
        with:
          repository: pii-shield/pii-shield-stats-private
          token: ${{ secrets.GH_TRAFFIC_TOKEN }}
          path: stats-repo

      - name: Fetch traffic data
        env:
          GH_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          # -f: an HTTP error (e.g. an expired token) fails the job instead of
          # writing the error body into the data files and committing it
          mkdir -p stats-repo/data
          curl -fsS --retry 3 -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pii-shield/pii-shield/traffic/views \
            > stats-repo/data/traffic_views.json
          curl -fsS --retry 3 -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pii-shield/pii-shield/traffic/clones \
            > stats-repo/data/traffic_clones.json
          curl -fsS --retry 3 -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pii-shield/pii-shield/traffic/popular/paths \
            > stats-repo/data/traffic_popular_paths.json
          curl -fsS --retry 3 -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pii-shield/pii-shield/traffic/popular/referrers \
            > stats-repo/data/traffic_popular_referrers.json
      
      - name: Fetch stars count
        env:
          GH_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          # without pipefail a failed curl is hidden behind jq's exit status
          set -o pipefail
          TODAY=$(date -u +%Y-%m-%d)
          FILE=stats-repo/data/stars_history.jsonl
          touch "$FILE"
          # re-runs on the same day must replace today's record, not append a duplicate
          grep -v "\"date\":\"$TODAY\"" "$FILE" > "$FILE.tmp" || true
          curl -fsS --retry 3 -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pii-shield/pii-shield \
            | jq -c '{stargazers_count, date: (now | gmtime | strftime("%Y-%m-%d"))}' \
            >> "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

      - name: Update normalized daily metrics
        working-directory: stats-repo
        run: python3 scripts/build_daily_metrics.py

      - name: Commit and push to private repo
        working-directory: stats-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update traffic stats $(date -u +%Y-%m-%d)"
          git push

      # Search Console runs after the traffic push, so a Search Console failure
      # still turns the run red but never holds back the day's traffic data.
      - name: Fetch Search Console data
        working-directory: stats-repo
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GSC_SERVICE_ACCOUNT_JSON secret is not set; Search Console data was not fetched"
            exit 0
          fi
          python3 scripts/fetch_gsc.py

      - name: Commit and push Search Console data
        working-directory: stats-repo
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "chore: update search console stats $(date -u +%Y-%m-%d)"
          git push
