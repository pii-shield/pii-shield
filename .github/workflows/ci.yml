name: PII-Shield CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify version files match VERSION
      run: scripts/set-version.sh --check

  test:
    name: Test, Lint & Fuzz
    runs-on: ubuntu-latest
    # The rule server's store runs on SQLite or Postgres; its tests run on
    # both (rules/internal/storetest).
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Verify Dependencies
      run: go mod verify

    - name: Run actionlint
      uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.14.0
        # The whole module, not only the lines a PR touches: the release
        # workflow lints everything, and v2.3.0's GoReleaser job failed on a
        # function #312 had left unused that the per-PR lint did not see.
        only-new-issues: false
        # v2.14.0 is the first release whose x/tools can read Go 1.27 export data.
        # Released binaries are built with Go 1.26 and refuse a go.mod targeting
        # 1.27.3, so build the linter with the repo's own toolchain.
        install-mode: goinstall

    - name: Run Fuzz Checks (Sanity)
      run: go test -fuzz=FuzzScanner -fuzztime=15s ./pkg/scanner

    - name: Run Tests (Race & Coverage)
      run: go test -race -coverprofile=coverage.out ./...

    - name: Run Operator Tests
      working-directory: operator
      run: go test -v -race -coverprofile=cover.out ./...

    - name: Run Rule Server Tests
      working-directory: rules
      run: go test -v -race ./...

    - name: Run Rule Server Tests on Postgres
      working-directory: rules
      env:
        RULES_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      run: go test -race -count=1 ./internal/store/... ./internal/server/...

    # The envtest suite is behind //go:build integration, so the step above
    # skips it: it starts a real kube-apiserver and checks the CRD schema and
    # the status subresource, which the fake client of the unit tests cannot.
    - name: Run Operator Integration Tests (envtest)
      working-directory: operator
      run: make test-integration

    - name: Lint Helm Charts
      run: |
        helm lint charts/pii-shield
        helm lint charts/pii-shield-operator
        helm template charts/pii-shield >/dev/null
        helm template charts/pii-shield-operator >/dev/null
        # Webhook policy rendering: overrides must reach the manifests.
        helm template charts/pii-shield-operator \
          --set webhook.failurePolicy=Fail --set webhook.strictMode=true \
          | grep -q 'failurePolicy: Fail'
        helm template charts/pii-shield-operator \
          --set webhook.strictMode=true \
          | grep -q 'STRICT_MODE'

    - name: Verify Helm Runtime
      run: scripts/verify-helm-runtime.sh

    - name: Verify multi-arch agent image build
      run: scripts/verify-agent-multiarch-build.sh

    # The rule server image is built from the repository root (the rules
    # module takes pkg/scanner from the root module), started single-tenant
    # and asked for the panel and for a published policy.json with a token.
    - name: Build and smoke the rule server image
      run: |
        docker build -t pii-shield-rules:smoke -f rules/Dockerfile .
        scripts/smoke-rules-server.sh pii-shield-rules:smoke
        docker buildx build --platform linux/amd64,linux/arm64 -f rules/Dockerfile .

    - name: Check Coverage Threshold
      run: |
        go tool cover -func=coverage.out
        total=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
        echo "Total Coverage: $total%"
        if (( $(echo "$total < 70.0" | bc -l) )); then
          echo "❌ Coverage is below 70%"
          exit 1
        fi

  # The eBPF audit agent (ebpf/, #96) builds on Linux only. The unit tests
  # need no kernel; the generated Go of bpf2go is compared after a rebuild
  # with the runner's clang (the .o files are not, since clang versions
  # differ), and the committed objects are then loaded into the runner's
  # kernel by the smoke, which watches a shell print a secret.
  ebpf:
    name: eBPF Audit Agent
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Verify Dependencies
      working-directory: ebpf
      run: go mod verify

    - name: Run Tests (Race)
      working-directory: ebpf
      run: go test -race ./...

    - name: Rebuild the BPF program and compare the generated Go
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q clang llvm
        (cd ebpf && go generate ./internal/probe/)
        git diff --exit-code -- 'ebpf/internal/probe/*.go'
        git checkout -- ebpf/internal/probe/

    - name: Build the agent
      working-directory: ebpf
      run: go build -o ../pii-shield-ebpf ./cmd/pii-shield-ebpf

    - name: Smoke on the runner kernel
      run: |
        uname -r
        scripts/smoke-ebpf-agent.sh ./pii-shield-ebpf

    # The image is built from the repository root (the module takes
    # pkg/ from the root module); its binary is copied out and loaded into
    # the runner's kernel by the same smoke, then a two-platform build.
    - name: Build and smoke the agent image
      run: |
        docker build -t pii-shield-ebpf:smoke -f ebpf/Dockerfile .
        scripts/smoke-ebpf-image.sh pii-shield-ebpf:smoke
        docker buildx build --platform linux/amd64,linux/arm64 -f ebpf/Dockerfile .

  # On a pull request this job compares the scanner benchmarks against the
  # PR base (scripts/bench-gate.sh): both test binaries are built on this
  # runner and run interleaved, and the job fails when a benchmark is slower
  # by more than 10% and benchstat calls the difference significant. Shared
  # runners are noisy, so the threshold catches regressions a reviewer would
  # care about, not a few percent; for precise numbers use
  # benchmark/run_benchmarks.sh on a quiet machine. A slowdown above 5% that
  # stays within 10% only warns (an annotation and a table in the job
  # summary).
  #
  # The second comparison is against the accepted baseline, the ref in
  # benchmark/baseline-ref: it warns above 8% and fails above 15%, so small
  # slowdowns cannot add up unnoticed (v2.2.0 -> v2.2.8 lost 13-24% of CLI
  # throughput, every PR within the 10% above). To accept a slowdown on
  # purpose, move benchmark/baseline-ref in the same PR.
  #
  # Both comparisons append their verdict and benchstat table to a report that
  # is uploaded as the bench-report artifact, passed or not; the bench-comment
  # workflow posts it on the pull request. This job keeps a read-only token,
  # so it works the same for pull requests from forks.
  #
  # On a push there is no base to compare with, so the benchmarks only run.
  # The job name is kept because the "Protect main" ruleset lists it as a
  # required check.
  benchmark:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'
    - name: Compare benchmarks with the PR base
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        LABEL: PR base
        REPORT: ${{ runner.temp }}/bench-report/report.md
      run: scripts/bench-gate.sh
    - name: Compare benchmarks with the accepted baseline
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        THRESHOLD_PCT: '15'
        WARN_PCT: '8'
        LABEL: accepted baseline
        REPORT: ${{ runner.temp }}/bench-report/report.md
      run: BASE_REF="$(tr -d '[:space:]' < benchmark/baseline-ref)" scripts/bench-gate.sh
    - name: Record the pull request number for the report
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIR: ${{ runner.temp }}/bench-report
      run: |
        mkdir -p "$DIR"
        touch "$DIR/report.md"
        echo "$PR_NUMBER" > "$DIR/pr-number"
    - name: Upload the benchmark report
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bench-report
        path: ${{ runner.temp }}/bench-report/
        retention-days: 7
    - name: Run benchmarks (push, no base to compare)
      if: github.event_name != 'pull_request'
      run: go test -run '^$' -bench=. -benchmem ./pkg/scanner
