name: PII-Shield CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify version files match VERSION
      run: scripts/set-version.sh --check

  test:
    name: Test, Lint & Fuzz
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Verify Dependencies
      run: go mod verify

    - name: Run actionlint
      uses: reviewdog/action-actionlint@13465d022aa41c282f730be17574b5ce692d0186

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.14.0
        only-new-issues: true
        # v2.14.0 is the first release whose x/tools can read Go 1.27 export data.
        # Released binaries are built with Go 1.26 and refuse a go.mod targeting
        # 1.27.2, so build the linter with the repo's own toolchain.
        install-mode: goinstall

    - name: Run Fuzz Checks (Sanity)
      run: go test -fuzz=FuzzScanner -fuzztime=15s ./pkg/scanner

    - name: Run Tests (Race & Coverage)
      run: go test -race -coverprofile=coverage.out ./...

    - name: Run Operator Tests
      working-directory: operator
      run: go test -v -race -coverprofile=cover.out ./...

    # The envtest suite is behind //go:build integration, so the step above
    # skips it: it starts a real kube-apiserver and checks the CRD schema and
    # the status subresource, which the fake client of the unit tests cannot.
    - name: Run Operator Integration Tests (envtest)
      working-directory: operator
      run: make test-integration

    - name: Lint Helm Charts
      run: |
        helm lint charts/pii-shield
        helm lint charts/pii-shield-operator
        helm template charts/pii-shield >/dev/null
        helm template charts/pii-shield-operator >/dev/null
        # Webhook policy rendering: overrides must reach the manifests.
        helm template charts/pii-shield-operator \
          --set webhook.failurePolicy=Fail --set webhook.strictMode=true \
          | grep -q 'failurePolicy: Fail'
        helm template charts/pii-shield-operator \
          --set webhook.strictMode=true \
          | grep -q 'STRICT_MODE'

    - name: Verify Helm Runtime
      run: scripts/verify-helm-runtime.sh

    - name: Verify multi-arch agent image build
      run: scripts/verify-agent-multiarch-build.sh

    - name: Check Coverage Threshold
      run: |
        go tool cover -func=coverage.out
        total=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
        echo "Total Coverage: $total%"
        if (( $(echo "$total < 70.0" | bc -l) )); then
          echo "❌ Coverage is below 70%"
          exit 1
        fi

  # On a pull request this job compares the scanner benchmarks against the
  # PR base (scripts/bench-gate.sh): both test binaries are built on this
  # runner and run interleaved, and the job fails when a benchmark is slower
  # by more than 10% and benchstat calls the difference significant. Shared
  # runners are noisy, so the threshold catches regressions a reviewer would
  # care about, not a few percent; for precise numbers use
  # benchmark/run_benchmarks.sh on a quiet machine. On a push there is no
  # base to compare with, so the benchmarks only run. The job name is kept
  # because the "Protect main" ruleset lists it as a required check.
  benchmark:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'
    - name: Compare benchmarks with the PR base
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
      run: scripts/bench-gate.sh
    - name: Run benchmarks (push, no base to compare)
      if: github.event_name != 'pull_request'
      run: go test -run '^$' -bench=. -benchmem ./pkg/scanner
