name: Test Coverage & SDKs

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'

    - name: Run Tests with Coverage
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Run Operator Tests
      working-directory: operator
      run: go test -v -race -coverprofile=cover.out ./...

    - name: Run Rule Server Tests
      working-directory: rules
      run: go test -v -race ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.out
        flags: unittests

    - name: Compile WASM FFI
      run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o pii-shield-wasi.wasm cmd/wasm-ffi/main.go
      
    - name: Upload WASM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: compiled-wasm
        path: pii-shield-wasi.wasm

  test-node:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20.x'
          
      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-wasm
          path: .
          
      - name: Test Node SDK
        working-directory: sdks/node
        run: node test.js

  test-python:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          
      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-wasm
          path: .
          
      - name: Install dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install wasmtime
          
      - name: Test Python SDK
        working-directory: sdks/python
        run: python test.py

  test-python-macos-system:
    # Apple's own /usr/bin/python3 (Xcode/CLT build, Python 3.9) is Apple-signed; wasmtime's
    # default Mach-port trap handler got it SIGKILLed on the first wasm call. Installs the
    # SDK from pyproject.toml so the declared wasmtime floor is what gets tested.
    needs: test-go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-wasm
          path: .

      - name: Install SDK into a venv from /usr/bin/python3
        working-directory: sdks/python
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -c "import sys; print(sys.version)"
          "$RUNNER_TEMP/venv/bin/pip" install .

      - name: Test Python SDK
        working-directory: sdks/python
        run: '"$RUNNER_TEMP/venv/bin/python" test.py'
