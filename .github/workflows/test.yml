name: Test Coverage & SDKs

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.26.5'

    - name: Run Tests with Coverage
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Run Operator Tests
      working-directory: operator
      run: go test -v -race -coverprofile=cover.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.out
        flags: unittests

    - name: Compile WASM FFI
      run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o pii-shield-wasi.wasm cmd/wasm-ffi/main.go
      
    - name: Upload WASM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: compiled-wasm
        path: pii-shield-wasi.wasm

  test-node:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.x'
          
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compiled-wasm
          path: .
          
      - name: Test Node SDK
        working-directory: sdks/node
        run: node test.js

  test-python:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compiled-wasm
          path: .
          
      - name: Install dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install wasmtime
          
      - name: Test Python SDK
        working-directory: sdks/python
        run: python test.py
